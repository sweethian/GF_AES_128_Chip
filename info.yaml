# Tiny Tapeout project information
project:
  title: "Tiny AES Encryption" # Project title
  author: "Swee & Shahum from MusangChip" # Your name
  discord: "sweethian & xpz24" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "To create lowest resource shared data AES encryption chip" # One line description of what your project does
  language: "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 10000000 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module: "tt_um_sweethian_aes"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_sweethian_aes.sv"
    - "AES_serial_wrapper.sv"
    - "AES_controller.sv"
    - "modules_AES.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "RX0"
  ui[1]: "RX1"
  ui[2]: "RX2"
  ui[3]: "RX3"
  ui[4]: "RX4"
  ui[5]: "RX5"
  ui[6]: "RX6"
  ui[7]: "RX7"

  # Outputs
  uo[0]: "TX0"
  uo[1]: "TX1"
  uo[2]: "TX2"
  uo[3]: "TX3"
  uo[4]: "TX4"
  uo[5]: "TX5"
  uo[6]: "TX6"
  uo[7]: "TX7"

  # Bidirectional pins
  uio[0]: "S_ENA"
  uio[1]: "BUSY"
  uio[2]: "DONE"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
